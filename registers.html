<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="static/css/form.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
</head>
<body>
    <div class="container">
        <div class="Logo">Pixel</div>
        <h1>Create Account</h1>
        <p class="subtitle">Please fill this form before creating an account</p>
        <form action="">
            <div class="input-group">
               <label for="fullname">Full Name</label>
               <input type="text" name="fullname" id="fullname" placeholder="Enter your full name" required> <br><br>
            </div>
            <div class="input-group">
               <label for="email">Email</label>
               <input type="text" name="email" id="email" placeholder="Enter your email" required> <br><br>
            </div>
            <div class="input-group">
               <label for="password">Password</label>
               <input type="text" name="password" id="password" placeholder="Enter your password" required> <br><br>
            </div>
            <div class="input-group">
               <label for="confirm password ">Confirm Password</label>
               <input type="text" name="confirm password" id="confirm password" placeholder="confirm password" required> <br><br>
            </div>
           <div class="terms"> 
             
            <input type="checkbox" name="terms" required>
            <label for="terms">i agree to the terms and conditions <a href="#">Terms and Conditions</a></label> <br>
           
           </div>
           <button type="submit">Create Account</button>

        </form>
        <p class="login">Already have an account?<a href="login.html">Log in here</a></p>
    </div>
    
</body>
</html>
