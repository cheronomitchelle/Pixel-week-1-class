<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms</title>
</head>
<body>
    <h1>Contact Form</h1>
    <form action="">
       <label for="fname">First Name</label>
       <input type="text" name="fname" id="fname" required> <br><br>
       <label for="mname">Middle name</label>
       <input type="text" name="mname" id="mname"><br><br>
       <label for="lname">Last Name</label>
       <input type="text" name="lname" id="lname" required> <br><br>
       <label for="age">Age</label>
       <input type="text" name="age" id="age" required> <br><br>
       <label for="gender">Gender</label>
       <select name="gender" id="gender" required>
        <option value="">Select</option>       
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="prefer not to say">Prefer not to say</option>

       </select> <br><br>
       <label for="email">Email</label>
       <input type="text" name="email" id="email" required> <br><br>
       <label for="upload">Upload File</label><br>
       <input type="file" name="upload" id="upload"> <br><br>
       <label for="password">Password</label> <br>
      <input type="password" name="password" id="password"> <br><br>
       <label for="dob">Date of Birth</label> <br>
      <input type="date" name="dob" id="dob"> <br><br>
       <label for="message">Message</label> <br>
       <textarea id="message" name="message" row="4" cols="50" required></textarea> <br>
       <input type="submit" value="submit">

    </form>
   
</body>
</html>
